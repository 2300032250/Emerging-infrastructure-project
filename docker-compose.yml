services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maturity
      POSTGRES_PASSWORD: maturity_dev_password
      POSTGRES_DB: maturity
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maturity"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://maturity:maturity_dev_password@postgres:5432/maturity
      CONFIG_VERSION: 1.0.0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
